<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我们的世界足迹｜GO-Travel</title>
    <style>
        :root { --primary: #3AA1FF; --bg: linear-gradient(135deg, #F0F4F8 0%, #E2E8F0 100%); --card: rgba(255, 255, 255, 0.85); --text: #2D3748; --side-w: 90px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: var(--side-w); background: rgba(255,255,255,0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.5); position: fixed; top:0; bottom:0; left:0; display:flex; flex-direction:column; padding:10px 0; z-index:100; overflow-y:auto; }
        .menu-item { padding: 16px 5px; font-size: 14px; font-weight: 700; color: #718096; cursor: pointer; transition: all 0.2s; border-left: 4px solid transparent; text-align: center; }
        .menu-item:hover, .menu-item.active { color: var(--primary); background: rgba(58,161,255,0.08); border-left-color: var(--primary); }
        .main-content { padding-left: calc(var(--side-w) + 20px); flex-grow: 1; padding-top: 30px; padding-right: 20px; padding-bottom: 40px; }
        header h1 { font-size: 24px; font-weight: 800; margin-bottom: 16px; }
        .progress-container { background: var(--card); padding: 14px 16px; border-radius: 16px; box-shadow: 0 4px 12px rgba(148,163,184,0.06); border: 1px solid rgba(255,255,255,0.6); margin-bottom: 25px; }
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 700;}
        .progress-bar { width: 100%; background: #E2E8F0; height: 10px; border-radius: 99px; overflow: hidden; }
        .progress { height: 100%; background: linear-gradient(90deg, var(--primary) 0%, #63B3ED 100%); width: 0%; border-radius: 99px; transition: width 0.4s ease; }
        .geo-group { margin-bottom: 30px; }
        .country-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;}
        .country-title::before { content: '📍'; }
        .attraction-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .attraction-card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.7); cursor: pointer; transition: all 0.25s; position: relative; }
        .attraction-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(148,163,184,0.12); }
        .card-banner { height: 120px; width: 100%; background: linear-gradient(45deg, #3AA1FF, #E2E8F0); background-size: cover; background-position: center; position: relative; }
        .city-badge { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); color: white; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .card-body { padding: 14px; display: flex; align-items: center; justify-content: space-between; }
        .attraction-name { font-size: 14px; font-weight: 700; line-height: 1.3;}
        .checkbox-circle { width: 22px; height: 22px; border: 2px solid #CBD5E1; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; flex-shrink: 0; }
        .attraction-card.done .checkbox-circle { background: var(--primary); border-color: var(--primary); }
        .checkbox-circle::after { content: ''; width: 4px; height: 8px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); display: none; margin-top: -2px; }
        .attraction-card.done .checkbox-circle::after { display: block; }
        .attraction-card.done .card-banner { filter: grayscale(0.5); opacity: 0.6; }
        .attraction-card.done .attraction-name { text-decoration: line-through; color: #A0AEC0; }
        .loading { text-align: center; font-size: 14px; font-weight: 600; color: #A0AEC0; padding: 80px 0; }
        @media(max-width: 600px) { .main-content { padding-left: calc(var(--side-w) + 15px); padding-right: 10px; } .attraction-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; } .card-banner { height: 95px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="menu-item active" onclick="switchContinent('亚洲')">亚洲</div>
        <div class="menu-item" onclick="switchContinent('欧洲')">欧洲</div>
        <div class="menu-item" onclick="switchContinent('北美洲')">北美洲</div>
        <div class="menu-item" onclick="switchContinent('南美洲')">南美洲</div>
        <div class="menu-item" onclick="switchContinent('大洋洲')">大洋洲</div>
        <div class="menu-item" onclick="switchContinent('非洲')">非洲</div>
        <div class="menu-item" onclick="switchContinent('南极洲')">南极洲</div>
    </div>
    <div class="main-content">
        <header><h1 id="mainTitle">亚洲 ｜ 我们的足迹</h1></header>
        <div class="progress-container">
            <div class="progress-header"><span>全球足迹打卡进度</span><span id="progressText">0 / 0</span></div>
            <div class="progress-bar"><div class="progress" id="progress"></div></div>
        </div>
        <div id="loading" class="loading">正在同步 GO-Travel Database...</div>
        <div id="listsContainer"></div>
    </div>
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxsdzsQLz8PhLK3ewhR4gT22D4oMW9wrA5vBf-uYiNSZFD9CkofiAtSktiRrcScGOY/exec'; 
        let rawData = [], currentCont = '亚洲';
        async function fetchTravelData() {
            try {
                const res = await fetch(API_URL);
                const txt = await res.text();
                rawData = JSON.parse(txt);
                if (Array.isArray(rawData)) {
                    document.getElementById('loading').style.display = 'none';
                    updateProgress(); render();
                }
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerText = '数据读取异常，请确认表格左下角标签名为 Travel。';
            }
        }
        function updateProgress() {
            const total = rawData.length, done = rawData.filter(i => i.completed).length;
            document.getElementById('progressText').innerText = `${done} / ${total}`;
            document.getElementById('progress').style.width = total > 0 ? `${(done / total) * 100}%` : '0%';
        }
        function switchContinent(name) {
            currentCont = name; document.getElementById('mainTitle').innerText = `${name} ｜ 我们的足迹`;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.toggle('active', el.innerText === name));
            render();
        }
        function render() {
            const container = document.getElementById('listsContainer'); container.innerHTML = '';
            const list = rawData.filter(item => String(item.continent).trim() === currentCont);
            if(list.length === 0) { container.innerHTML = `<div class="loading">✈️ 暂无 ${currentCont} 的旅行足迹。</div>`; return; }
            const groups = {}; list.forEach(item => { const c = item.country || '其他国家'; if(!groups[c]) groups[c] = []; groups[c].push(item); });
            for (const country in groups) {
                const group = document.createElement('div'); group.className = 'geo-group';
                group.innerHTML = `<div class="country-title">${country}</div>`;
                const grid = document.createElement('div'); grid.className = 'attraction-grid';
                groups[country].forEach(item => {
                    const card = document.createElement('div'); card.className = `attraction-card ${item.completed ? 'done' : ''}`;
                    card.onclick = () => toggle(item.id, !item.completed);
                    card.innerHTML = `<div class="card-banner" style="${item.image ? `background-image:url('${item.image}')`:''}">
                        <span class="city-badge">${item.city || ''}</span></div><div class="card-body">
                        <span class="attraction-name">${item.attraction || ''}</span><div class="checkbox-circle"></div></div>`;
                    grid.appendChild(card);
                });
                group.appendChild(grid); container.appendChild(group);
            }
        }
        async function toggle(id, state) {
            const target = rawData.find(i => i.id === id); if(target) target.completed = state;
            updateProgress(); render();
            try { await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, completed: state }) }); } catch (e) { console.error(e); }
        }
        fetchTravelData();
    </script>
</body>
</html>
